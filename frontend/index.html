<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- 파비콘은 인라인 SVG 로 둔다 — 바이너리 자산도 public/ 도 만들지 않는다. 색은 --c-primary(#2b5ce6). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b5ce6'/%3E%3Crect x='7' y='9' width='18' height='16' rx='3' fill='%23ffffff'/%3E%3Crect x='7' y='9' width='18' height='4' rx='2' fill='%23c9d6fb'/%3E%3Crect x='10' y='16' width='8' height='5' rx='1.5' fill='%232b5ce6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Plan B: 사내망에서 jsdelivr 이 막히면 아래 한 줄을 Google Fonts 의 Noto Sans KR(400/500/700)로 교체한다. 폴백 스택(tokens.css --ff-sans)만으로도 한글은 깨지지 않는다. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>회의실 예약</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
